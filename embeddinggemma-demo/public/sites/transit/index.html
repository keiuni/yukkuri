<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>のりかえナビ｜経路検索</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../sites.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html">のりかえナビ</a>
      <nav aria-label="サイトメニュー">
        <a href="#">運行情報</a>
        <a href="#">時刻表</a>
        <a href="#">路線図</a>
        <a href="#">ヘルプ</a>
      </nav>
    </header>
    <main>
      <h1>経路をさがす</h1>
      <form class="panel" action="results.html" method="get">
        <div class="form-grid">
          <label class="field">出発地
            <input type="text" name="from" placeholder="駅名を入力" autocomplete="off" />
          </label>
          <label class="field">到着地
            <input type="text" name="to" placeholder="駅名を入力" autocomplete="off" />
          </label>
          <label class="field">日付
            <select name="date">
              <option value="2026-10-08">10月8日（木）</option>
              <option value="2026-10-09">10月9日（金）</option>
              <option value="2026-10-10">10月10日（土）</option>
              <option value="2026-10-11">10月11日（日）</option>
            </select>
          </label>
          <label class="field">出発時刻
            <select name="time">
              <option value="6">6時</option>
              <option value="7">7時</option>
              <option value="8">8時</option>
              <option value="9">9時</option>
              <option value="10" selected>10時</option>
              <option value="11">11時</option>
              <option value="12">12時</option>
              <option value="13">13時</option>
              <option value="14">14時</option>
              <option value="15">15時</option>
              <option value="16">16時</option>
              <option value="17">17時</option>
              <option value="18">18時</option>
              <option value="19">19時</option>
              <option value="20">20時</option>
              <option value="21">21時</option>
              <option value="22">22時</option>
            </select>
          </label>
          <button class="primary" type="submit">経路を検索</button>
        </div>
      </form>
      <section class="panel">
        <h2>よく使う駅</h2>
        <a class="button" href="results.html?from=東京&to=新大阪&time=10">東京 → 新大阪</a>
        <a class="button" href="results.html?from=品川&to=名古屋&time=10">品川 → 名古屋</a>
      </section>
    </main>
  </body>
</html>
